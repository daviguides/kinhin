[package]
name = "kinhin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "TDD lifecycle manager for code-assistant workflows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/daviguides/kinhin"

[[bin]]
name = "kinhin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
owo-colors = "4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
